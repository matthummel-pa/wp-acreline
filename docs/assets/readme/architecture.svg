<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Architecture: WordPress → Acorn → app modules → Blade views → Vite assets; content from listing, agent and booking post types plus Customizer, Theme Settings and the setup wizard; ship via GitHub Actions to the theme-latest release and Appearance → Update Theme on the buyer site.">
  <style>
    :root { --ink:#0f1c2e; --muted:#5b6b7f; --line:#c5d0de; --box:#ffffff; --tint:#f3f5f8; --navy:#1f6b4a; --blue:#1f6b4a; --teal:#e2c27a; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e6edf3; --muted:#9aa7b8; --line:#30363d; --box:#161b22; --tint:#0d1117; --navy:#9fd8bf; --blue:#9fd8bf; --teal:#e2c27a; } }
    .lane { fill: var(--tint); stroke: var(--line); }
    .lanet { font: 700 12px/1 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; } .box.hi { stroke: var(--navy); stroke-width: 1.6; }
    .t { font: 700 14px/1 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--ink); } .s { font: 400 12px/1.3 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--muted); } .m { font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; fill: var(--blue); }
    .arrow { stroke: var(--navy); stroke-width: 1.6; fill: none; marker-end: url(#a); } .arrow.teal { stroke: var(--teal); marker-end: url(#at); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6b4a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e2c27a"/></marker>
  </defs>
  <rect class="lane" x="20" y="20" width="1060" height="150" rx="12"/><text class="lanet" x="36" y="44">Request</text>
  <g transform="translate(40,60)"><rect class="box" width="150" height="88" rx="10"/><text class="t" x="14" y="26">WordPress</text><text class="s" x="14" y="46">Template hierarchy</text><text class="m" x="14" y="80">functions.php</text></g>
  <g transform="translate(230,60)"><rect class="box" width="160" height="88" rx="10"/><text class="t" x="14" y="26">Acorn 6</text><text class="s" x="14" y="46">Boots Laravel pieces</text><text class="m" x="14" y="80">Application::configure()</text></g>
  <g transform="translate(430,60)"><rect class="box hi" width="200" height="88" rx="10"/><text class="t" x="14" y="26">app/*.php · 14 modules</text><text class="s" x="14" y="46">Post types, blocks, wizard,</text><text class="s" x="14" y="61">settings, updater, demo seed</text><text class="m" x="14" y="80">namespace App</text></g>
  <g transform="translate(670,60)"><rect class="box hi" width="190" height="88" rx="10"/><text class="t" x="14" y="26">Blade views</text><text class="s" x="14" y="46">42 Blade templates</text><text class="s" x="14" y="61">blocks render server-side</text><text class="m" x="14" y="80">resources/views/</text></g>
  <g transform="translate(900,60)"><rect class="box" width="160" height="88" rx="10"/><text class="t" x="14" y="26">Vite 8 assets</text><text class="s" x="14" y="46">Tailwind v4 tokens,</text><text class="s" x="14" y="61">small JS modules</text><text class="m" x="14" y="80">public/build/manifest</text></g>
  <path class="arrow" d="M190 104h38"/><path class="arrow" d="M390 104h38"/><path class="arrow" d="M630 104h38"/><path class="arrow" d="M860 104h38"/>
  <rect class="lane" x="20" y="190" width="520" height="160" rx="12"/><text class="lanet" x="36" y="214">Content</text>
  <g transform="translate(40,230)"><rect class="box" width="230" height="100" rx="10"/><text class="t" x="14" y="26">Listings · Agents · Bookings</text><text class="s" x="14" y="46">Custom post types + meta,</text><text class="s" x="14" y="61">Acreline Core keeps them</text><text class="m" x="14" y="80">app/post-types.php</text></g>
  <g transform="translate(290,230)"><rect class="box" width="230" height="100" rx="10"/><text class="t" x="14" y="26">Customizer + Theme Settings</text><text class="s" x="14" y="46">39 + 78 settings, 8 color</text><text class="s" x="14" y="61">styles, five-step wizard</text><text class="m" x="14" y="80">app/setup-wizard.php</text></g>
  <rect class="lane" x="560" y="190" width="520" height="160" rx="12"/><text class="lanet" x="576" y="214">Buyer tools (no plugins, no APIs)</text>
  <g transform="translate(580,230)"><rect class="box" width="150" height="100" rx="10"/><text class="t" x="14" y="26">Block Generator</text><text class="s" x="14" y="46">No-code blocks and</text><text class="s" x="14" y="61">Migrate to Blocks</text><text class="m" x="14" y="80">block-generator.php</text></g>
  <g transform="translate(745,230)"><rect class="box" width="155" height="100" rx="10"/><text class="t" x="14" y="26">Calculators + tools</text><text class="s" x="14" y="46">Mortgage, compare, saved,</text><text class="s" x="14" y="61">market snapshot, share</text><text class="m" x="14" y="80">resources/js/</text></g>
  <g transform="translate(915,230)"><rect class="box" width="145" height="100" rx="10"/><text class="t" x="14" y="26">Native SEO</text><text class="s" x="14" y="46">Title, meta, OG, Twitter;</text><text class="s" x="14" y="61">yields to SEO plugins</text><text class="m" x="14" y="80">app/filters.php</text></g>
  <path class="arrow teal" d="M155 230V148"/><path class="arrow teal" d="M405 230V148"/><path class="arrow teal" d="M655 230V148"/>
  <rect class="lane" x="20" y="370" width="1060" height="130" rx="12"/><text class="lanet" x="36" y="394">Ship</text>
  <g transform="translate(40,410)"><rect class="box" width="170" height="72" rx="10"/><text class="t" x="14" y="26">PR → main</text><text class="s" x="14" y="46">Pint · wp-review (WPCS)</text><text class="s" x="14" y="61">build · theme.json check</text></g>
  <g transform="translate(250,410)"><rect class="box" width="190" height="72" rx="10"/><text class="t" x="14" y="26">GitHub Actions</text><text class="s" x="14" y="46">composer --no-dev, npm build,</text><text class="s" x="14" y="61">theme + install packs</text></g>
  <g transform="translate(480,410)"><rect class="box" width="190" height="72" rx="10"/><text class="t" x="14" y="26">Release theme-latest</text><text class="s" x="14" y="46">acreline.zip + child +</text><text class="s" x="14" y="61">Core plugin + docs</text></g>
  <g transform="translate(710,410)"><rect class="box hi" width="170" height="72" rx="10"/><text class="t" x="14" y="26">Update Theme</text><text class="s" x="14" y="46">Appearance screen on the</text><text class="m" x="14" y="63">PAT: Contents read</text></g>
  <g transform="translate(920,410)"><rect class="box" width="140" height="72" rx="10"/><text class="t" x="14" y="26">Live demo</text><text class="s" x="14" y="46">acreline.matthummel.com</text><text class="s" x="14" y="61">fiction-only data</text></g>
  <path class="arrow" d="M210 446h38"/><path class="arrow" d="M440 446h38"/><path class="arrow" d="M670 446h38"/><path class="arrow" d="M880 446h38"/>
