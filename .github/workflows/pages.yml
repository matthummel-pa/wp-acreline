name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build minimal site folder
        run: |
          mkdir -p _site/docs/marketplace/screenshots
          cp index.html _site/index.html
          touch _site/.nojekyll
          # Copy documentation and screenshot assets only
          cp -r docs/marketplace _site/docs/
          # Copy brand images if present
          if [ -d public/images/brand ]; then
            mkdir -p _site/public/images/brand
            cp -r public/images/brand _site/public/images/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
